name: release

# Publishes to PyPI when you publish a GitHub Release (tag vX.Y.Z).
# Uses PyPI "trusted publishing" (OIDC): no API token is stored anywhere.
# Run it manually (Actions tab > release > Run workflow) to rehearse on TestPyPI.
# No Docker is used or required anywhere in this pipeline.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build twine

      - name: Tag must match the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python - <<'PY'
          import re, pathlib
          src = pathlib.Path("bitstraining/__init__.py").read_text()
          print(re.search(r'__version__\s*=\s*"([^"]+)"', src).group(1))
          PY
          )
          echo "package version: $VERSION, release tag: $TAG"
          test "v$VERSION" = "$TAG" || { echo "::error::tag $TAG does not match version $VERSION"; exit 1; }

      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  test-built-wheel:
    # Test what users will actually install, on every OS, before anything is uploaded.
    needs: build
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Install the wheel (not the source tree) and pytest
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install dist/*.whl
      - name: Smoke test
        working-directory: ${{ runner.temp }}
        run: |
          bitstraining --version
          bitstraining plugins
          bitstraining quickstart
      - name: Run the test suite against the installed wheel
        shell: bash
        env:
          BT_EXPECT_INSTALLED: "1"
        run: pytest tests

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: test-built-wheel
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release'
    needs: test-built-wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
